<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Flywheel Simulator</title>
<style>
:root{
  --bg:#0e1230;--bg2:#161b44;--line:#2e3875;--text:#f1f3ff;--muted:#a3abd6;
  --visitor:#8f9ac8;--lead:#3fd6c4;--cust:#ffc04d;--alex:#ff6f91;--bad:#ff5a6e;--good:#6ee79a;--new:#9ef06a;
  --btn:#ffc04d;--btnText:#2a1c00;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:radial-gradient(1100px 650px at 50% -12%,#232a6b 0%,var(--bg) 62%);background-color:var(--bg);color:var(--text);
  font-family:"Avenir Next","Nunito","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;padding:14px}
.app{max-width:1040px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:15px;color:var(--muted)}
.brand b{color:var(--cust)}
.progress{display:flex;gap:6px;align-items:center}
.progress span{width:22px;height:7px;border-radius:4px;background:#2a3270;transition:all .4s}
.progress span.done{background:var(--lead)}
.progress span.on{background:var(--cust);width:38px}
.top{min-height:96px;text-align:center;padding:4px 8px 12px}
.kicker{font-size:13px;color:var(--cust);font-weight:800;min-height:18px}
h1{font-size:clamp(24px,4.6vw,42px);font-weight:900;line-height:1.1;margin:4px 0 6px}
.sub{white-space:pre-line;color:var(--muted);font-size:clamp(14px,2vw,17px);max-width:680px;margin:0 auto}
.stage-wrap{position:relative;background:linear-gradient(180deg,var(--bg2),#11163a);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 24px 70px rgba(3,5,25,.55)}
svg#stage{display:block;width:100%;height:auto}
.badge{position:absolute;top:10px;left:10px;background:rgba(255,192,77,.12);border:1px solid rgba(255,192,77,.55);color:#ffd489;border-radius:10px;padding:6px 10px;font-size:11px;font-weight:900;letter-spacing:.06em;opacity:0;transform:translateY(-6px);transition:all .4s;pointer-events:none;max-width:270px}
.badge small{display:block;font-weight:600;letter-spacing:0;color:#f0dcb4;font-size:10.5px;margin-top:2px}
.badge.show{opacity:1;transform:none}
.bottom{text-align:center;padding:16px 8px 36px;min-height:180px}
.msg{font-size:clamp(15px,2.1vw,18px);margin:6px auto;max-width:700px;opacity:0;transform:translateY(8px);transition:all .5s;line-height:1.5}
.msg.in{opacity:1;transform:none}
.msg.big{font-size:clamp(20px,3vw,28px);font-weight:900}
.msg.good{color:var(--good)}.msg.bad{color:var(--bad)}.msg.muted{color:var(--muted);font-size:14px}
.question{font-size:clamp(17px,2.5vw,23px);font-weight:900;margin:16px 0 12px}
.question:empty{display:none}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.btn{font:inherit;font-weight:900;font-size:15px;letter-spacing:.03em;text-transform:uppercase;padding:16px 24px;border-radius:16px;border:2px solid var(--btn);background:var(--btn);color:var(--btnText);cursor:pointer;box-shadow:0 6px 0 #b9811a;transition:transform .12s,box-shadow .12s;min-width:220px}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 #b9811a}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b9811a}
.btn.alt{background:transparent;color:var(--text);border-color:#5563b0;box-shadow:0 6px 0 #252d66}
.btn.alt:hover{box-shadow:0 8px 0 #252d66}
.btn:focus-visible,.tog:focus-visible{outline:3px solid var(--lead);outline-offset:3px}
.tog{font:inherit;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:10px;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:#1a2150;color:var(--text);cursor:pointer}
.tog .sw{width:38px;height:22px;border-radius:11px;background:#3a4280;position:relative;transition:background .25s}
.tog .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .25s}
.tog.on .sw{background:var(--lead)}
.tog.on .sw::after{transform:translateX(16px)}
.tog b{font-size:12px;color:var(--muted);min-width:26px}
.tog.on b{color:var(--lead)}
.toggles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}

/* SVG */
.bx{fill:#1c2352;stroke:#414e96;stroke-width:1.6}
.lbl{fill:var(--text);font-weight:900;font-size:14px;letter-spacing:.04em}
.small{fill:var(--muted);font-size:12.5px;font-weight:700}
.ico{font-size:22px}
.ledger{font-size:15px;font-weight:900;fill:var(--text)}
.ledger.good{fill:var(--good)}.ledger.bad{fill:var(--bad)}.ledger.arrow{fill:#6d78b3}
.listbox{fill:rgba(63,214,196,.07);stroke:var(--lead);stroke-width:2}
.count{fill:var(--lead);font-size:17px}
.cardr{fill:#f6f7ff;stroke:#cfd4f5}
.cardt{fill:#161b44;font-weight:900;font-size:13px}
.cards{fill:#4d5690;font-size:11px;font-weight:700}
.env rect{fill:#f6f7ff}
.env path{fill:none;stroke:#8f9ac8;stroke-width:1}
.ghost circle,.ghost path{fill:none;stroke:var(--bad);stroke-width:1.1}
.ghost{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:.65}}
.track{stroke:#2e3875;stroke-width:5;stroke-linecap:round}
.station{fill:#1c2352;stroke:#414e96;stroke-width:2.5;transition:fill .4s,stroke .4s}
.station.lit{fill:rgba(255,111,145,.18);stroke:var(--alex)}
.station.gold{fill:rgba(255,192,77,.25);stroke:var(--cust)}
.tok{fill:var(--cust);stroke:#b98217;stroke-width:1.5}
.tokt{fill:#5a3a00;font-weight:900;font-size:11px}
.wheelpath{fill:none;stroke:#46539a;stroke-width:5;stroke-linecap:round}
.node{fill:#1c2352;stroke:var(--cust);stroke-width:2.5}
.node.off{stroke:#555e8e;fill:#121638}
.nodelbl.off{opacity:.4}
.seg{fill:none;stroke:#46539a;stroke-width:6;stroke-linecap:round}
.seg.off{stroke:var(--bad);stroke-dasharray:7 9;opacity:.7}
.ringdash{fill:none;stroke:rgba(255,192,77,.5);stroke-width:3;stroke-dasharray:4 16}
.bigt{fill:#fff;font-weight:900;font-size:24px}
.meterbg{fill:#252c60}.meter{fill:var(--lead)}
.halo{fill:rgba(255,192,77,.12);stroke:var(--cust);stroke-width:2}
.glow{fill:rgba(63,214,196,.22);stroke:var(--lead);stroke-width:1.4}
.conn{stroke:#4f5c9f;stroke-width:2;stroke-dasharray:5 6}
.tdot{fill:#2a3270;stroke:#46539a;stroke-width:2;transition:fill .3s}
.tdot.lit{fill:var(--lead);stroke:var(--lead)}
.arrowl{stroke:#56629f;stroke-width:2.5}
.panelcard{fill:#141a45;stroke:#2e3875}
@media (prefers-reduced-motion:reduce){.ghost{animation:none;opacity:.45}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">The <b>Flywheel</b> Simulator</div>
    <div class="progress" id="progress"></div>
  </header>
  <div class="top">
    <div class="kicker" id="kicker"></div>
    <h1 id="headline"></h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="stage-wrap">
    <svg id="stage" viewBox="0 0 1000 560" role="img" aria-label="Simulation stage"></svg>
    <div class="badge" id="badge">SIMULATION EXAMPLE ONLY<small>These numbers are for demonstration and are not predicted results.</small></div>
  </div>
  <div class="bottom">
    <div id="msgs"></div>
    <div class="question" id="question"></div>
    <div class="actions" id="actions"></div>
  </div>
</div>

<script>
(function(){
'use strict';
const NS='http://www.w3.org/2000/svg';
// Set this to the published HBA presentation page URL in your Funnel Builder.
const NEXT_STEP_URL='';
function takeNextStep(){
  if(NEXT_STEP_URL && /^https?:\/\//i.test(NEXT_STEP_URL)){window.location.assign(NEXT_STEP_URL);}
  else {alert('The HBA presentation page link has not been added yet. Add its published URL to NEXT_STEP_URL in index.html.');}
}
const $=id=>document.getElementById(id);
const svg=$('stage');
let RUN=0, BACK, FRONT, TOP;

/* ---------- utilities ---------- */
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const lin=t=>t;
const rand=(a,b)=>a+Math.random()*(b-a);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sleep(ms){const r=RUN;return new Promise(res=>setTimeout(()=>{if(r===RUN)res();},ms));}
function tween(ms,fn,e){e=e||ease;const r=RUN;return new Promise(res=>{const t0=performance.now();const f=now=>{if(r!==RUN)return;const t=Math.min(1,(now-t0)/ms);fn(e(t),t);if(t<1)requestAnimationFrame(f);else res();};requestAnimationFrame(f);});}
function loop(fn){const r=RUN;let last=performance.now();const f=now=>{if(r!==RUN)return;const dt=Math.min(.05,(now-last)/1000);last=now;fn(dt,now);requestAnimationFrame(f);};requestAnimationFrame(f);}
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||svg).appendChild(e);return e;}
function txt(x,y,s,cls,parent,lh,anchor){
  lh=lh||16;const t=el('text',{x:x,y:y,class:cls||'lbl','text-anchor':anchor||'middle','dominant-baseline':'central'},parent||TOP);
  const lines=String(s).split('\n');
  if(lines.length===1)t.textContent=s;
  else lines.forEach((ln,i)=>{const sp=el('tspan',{x:x,y:y-(lines.length-1)*lh/2+i*lh},t);sp.textContent=ln;});
  return t;
}
function fade(e,to,ms,from){const f=from!=null?from:parseFloat(e.style.opacity===''?1:e.style.opacity);return tween(ms||500,t=>{e.style.opacity=lerp(f,to,t);});}
function show(e,ms){e.style.opacity=0;return fade(e,1,ms||450,0);}

const PERSON='<circle cx="0" cy="-6.5" r="4.1"/><path d="M-6.2,7 C-6.2,-1.2 6.2,-1.2 6.2,7 Z"/>';
function sprite(g,x,y,s,o){const p={g:g,x:x,y:y,s:s==null?1:s,o:o==null?1:o,set(){this.g.setAttribute('transform','translate('+this.x.toFixed(1)+','+this.y.toFixed(1)+') scale('+this.s.toFixed(3)+')');this.g.style.opacity=this.o;}};p.set();return p;}
function person(x,y,color,parent,s,o){const g=el('g',{},parent||FRONT);g.innerHTML=PERSON;g.style.fill=color||'var(--visitor)';return sprite(g,x,y,s,o);}
function token(x,y,parent,s,o){const g=el('g',{},parent||FRONT);g.innerHTML='<circle r="11" class="tok"/><text class="tokt" text-anchor="middle" dominant-baseline="central">V</text>';return sprite(g,x,y,s,o);}
function envelope(x,y,parent,s,o){const g=el('g',{class:'env'},parent||TOP);g.innerHTML='<rect x="-7" y="-5" width="14" height="10" rx="1.5"/><path d="M-7,-5 L0,1 L7,-5"/>';return sprite(g,x,y,s,o);}
function card(x,y,title,sub,color){const g=el('g',{},TOP);const w=156,h=sub?52:40;const r=el('rect',{x:-w/2,y:-h/2,width:w,height:h,rx:10,class:'cardr'},g);if(color){r.style.stroke=color;r.style.strokeWidth=3;}txt(0,sub?-9:0,title,'cardt',g);if(sub)txt(0,11,sub,'cards',g);return sprite(g,x,y);}

function moveAll(list,targets,dur,stagger,e,onArrive){
  dur=dur||900;stagger=stagger||0;e=e||ease;
  const st=list.map(p=>({x:p.x,y:p.y,s:p.s,o:p.o}));const done=list.map(()=>false);
  const total=dur+stagger*Math.max(0,list.length-1);
  return tween(total,(_,T)=>{const now=T*total;list.forEach((p,i)=>{const lt=Math.max(0,Math.min(1,(now-i*stagger)/dur));const k=e(lt),a=st[i],b=targets[i];
    p.x=lerp(a.x,b.x,k);p.y=lerp(a.y,b.y,k);if(b.s!=null)p.s=lerp(a.s,b.s,k);if(b.o!=null)p.o=lerp(a.o,b.o,k);p.set();
    if(lt>=1&&!done[i]){done[i]=true;if(onArrive)onArrive(p,i);}});},lin);
}
function box(cx,cy,w,h,label,o){
  o=o||{};const g=el('g',{},o.parent||BACK);
  const r=el('rect',{x:cx-w/2,y:cy-h/2,width:w,height:h,rx:14,class:'bx'},g);
  if(o.color)r.style.stroke=o.color;if(o.dash)r.setAttribute('stroke-dasharray','7 6');
  let ly=cy;
  if(o.top)ly=cy-h/2+20;
  else if(o.icon){txt(cx,cy-18,o.icon,'ico',g);ly=cy+18;}
  const t=txt(cx,ly,label,'lbl',g,16);if(o.labelColor)t.style.fill=o.labelColor;
  return{g:g,r:r,t:t,cx:cx,cy:cy,w:w,h:h};
}
function arrowLine(x1,y1,x2,y2,parent,dash){const l=el('line',{x1:x1,y1:y1,x2:x2,y2:y2,class:'arrowl','marker-end':'url(#arr)'},parent||BACK);if(dash)l.setAttribute('stroke-dasharray','6 6');return l;}
function ledger(x,y,first){const L={y:y,n:0,add(s,cls){if(this.n>0){show(txt(x,this.y,'↓','ledger arrow',TOP),300);this.y+=22;}show(txt(x,this.y,s,'ledger '+(cls||''),TOP),400);this.y+=22;this.n++;}};if(first)L.add(first);return L;}
function gridPos(x0,y0,cols,rows,dx,dy){const a=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)a.push({x:x0+c*dx,y:y0+r*dy});return a;}
function pulseRect(r,w0,w1,ms){return tween(ms||600,t=>{r.style.strokeWidth=lerp(w0,w1,Math.sin(t*Math.PI));},lin);}
function confetti(x,y,n){
  const cols=['#ffc04d','#3fd6c4','#ff6f91','#9ef06a','#ffffff'];const ps=[];
  for(let i=0;i<(n||44);i++){const c=el('rect',{x:-3,y:-5,width:6,height:10,rx:1},TOP);c.style.fill=cols[i%cols.length];ps.push({c:c,vx:rand(-260,260),vy:rand(-420,-140),r:rand(0,360),vr:rand(-500,500)});}
  return tween(1500,(_,t)=>{const T=t*1.5;ps.forEach(p=>{p.c.setAttribute('transform','translate('+(x+p.vx*T)+','+(y+p.vy*T+330*T*T)+') rotate('+(p.r+p.vr*T)+')');p.c.style.opacity=1-t;});},lin).then(()=>ps.forEach(p=>p.c.remove()));
}
function floatText(x,y,s,color){const t=txt(x,y,s,'lbl',TOP);t.style.fill=color||'var(--cust)';tween(1100,k=>{t.setAttribute('y',y-30*k);t.style.opacity=1-k;},lin).then(()=>t.remove());}

/* ---------- UI ---------- */
const TOTAL_STEPS=9;
(function(){const p=$('progress');for(let i=0;i<TOTAL_STEPS;i++)p.appendChild(document.createElement('span'));})();
function setProgress(n){[...$('progress').children].forEach((s,i)=>{s.className=i<n-1?'done':(i===n-1?'on':'');});}
function setTop(k,h,s){$('kicker').textContent=k||'';$('headline').textContent=h||'';$('sub').textContent=s||'';}
function clearBottom(){$('msgs').innerHTML='';$('question').textContent='';$('actions').innerHTML='';}
function badge(on){$('badge').classList.toggle('show',!!on);}
function say(s,cls){const p=document.createElement('p');p.className='msg '+(cls||'');p.innerHTML=s;$('msgs').appendChild(p);requestAnimationFrame(()=>requestAnimationFrame(()=>p.classList.add('in')));}
function ask(q,opts){
  $('question').textContent=q||'';const a=$('actions');a.innerHTML='';
  opts.forEach(o=>{const b=document.createElement('button');b.className='btn'+(o.alt?' alt':'');b.textContent=o.label;
    b.onclick=()=>{[...a.children].forEach(c=>c.disabled=true);$('question').textContent='';a.innerHTML='';o.go();};a.appendChild(b);});
  setTimeout(()=>{const r=a.getBoundingClientRect();if(r.bottom>window.innerHeight)a.scrollIntoView({behavior:'smooth',block:'end'});},60);
}
function newScene(n){
  RUN++;svg.innerHTML='';
  const defs=el('defs');
  defs.innerHTML='<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d78b3"/></marker>';
  BACK=el('g');FRONT=el('g');TOP=el('g');
  badge(false);clearBottom();if(n)setProgress(n);
  if(window.scrollY>80)window.scrollTo({top:0,behavior:'smooth'});
}
async function wipe(ms){await tween(ms||500,t=>{[BACK,FRONT,TOP].forEach(g=>g.style.opacity=1-t);});[BACK,FRONT,TOP].forEach(g=>{g.innerHTML='';g.style.opacity=1;});}

/* ====================================================
   SCENE 1 — YOU BOUGHT TRAFFIC
==================================================== */
async function scene1(){
  newScene(1);
  setTop('Scene 1 · Traffic','YOU HAVE 100 VISITORS','“You just brought 100 people to your website.”');
  const ad=box(110,258,140,100,'TRAFFIC\nSOURCE',{icon:'📣'});show(ad.g,400);
  const ads=txt(110,325,'Organic or Paid','small',BACK);show(ads,400);
  arrowLine(186,258,248,258);
  const ct=txt(378,120,'0 VISITORS','lbl count');ct.style.fill='var(--text)';
  const grid=gridPos(270,150,10,10,24,24);
  const vis=grid.map(()=>person(110,258,'var(--visitor)',FRONT,.2,0));
  await sleep(350);
  let n=0;
  await moveAll(vis,grid.map(g=>({x:g.x,y:g.y,s:1,o:1})),650,14,easeOut,()=>{n++;ct.textContent=n+' VISITORS';});
  await sleep(300);
  ask('What do you want to do with this traffic?',[
    {label:'Send them directly to the offer',go:()=>pathDirect(vis,grid)},
    {label:'Capture leads first',go:scene2}
  ]);
}

async function pathDirect(vis,grid){
  clearBottom();
  setTop('Scene 1 · Direct to offer','STRAIGHT TO THE OFFER','Every visitor sees the offer right away.');
  arrowLine(500,258,568,258);
  const offer=box(650,258,150,110,'OFFER',{icon:'🏷️'});show(offer.g,400);
  const cust=box(880,150,170,96,'CUSTOMERS',{top:true,color:'var(--cust)'});show(cust.g,400);
  const led=ledger(880,262,'100 VISITORS');
  await sleep(600);
  await moveAll(vis,vis.map(()=>({x:650+rand(-58,58),y:272+rand(-16,28),s:.55})),950,6);
  led.add('100 SEE OFFER');
  await sleep(700);
  const bi=[12,47,83],buyers=bi.map(i=>vis[i]);
  buyers.forEach(p=>p.g.style.fill='var(--cust)');
  await moveAll(buyers,[{x:845,y:172,s:1.35},{x:880,y:172,s:1.35},{x:915,y:172,s:1.35}],850,160);
  led.add('3 BUY','good');
  await sleep(500);
  const leavers=vis.filter((p,i)=>bi.indexOf(i)<0);
  await moveAll(leavers,leavers.map(p=>({x:p.x+rand(30,170),y:590+rand(0,50),o:0,s:.4})),1100,6);
  leavers.forEach(p=>p.g.remove());
  led.add('97 LEAVE','bad');
  badge(true);
  await sleep(500);
  say('You made 3 sales.','big good');
  await sleep(1400);
  say('But 97 people left.','big bad');
  grid.forEach((g,i)=>{if(bi.indexOf(i)>=0)return;const gg=el('g',{class:'ghost',transform:'translate('+g.x+','+g.y+')'},BACK);gg.innerHTML=PERSON;});
  const hole=txt(378,392,'Where did they go?','small',BACK);hole.style.fill='var(--bad)';
  await sleep(1700);
  say('You didn\'t capture their contact details.<br>You have no direct way to continue following up with those visitors.');
  await sleep(1300);
  ask('What if you captured the leads first?',[{label:'Try lead capture',go:scene2}]);
}

/* ====================================================
   SCENE 2 — CAPTURE THE LEADS
==================================================== */
function emailList(n){
  const cx=840,cy=250,w=240,h=270;const g=el('g',{},BACK);
  const r=el('rect',{x:cx-w/2,y:cy-h/2,width:w,height:h,rx:18,class:'listbox'},g);
  txt(cx,cy-h/2+22,'✉  YOUR EMAIL LIST','lbl',g);
  const slots=[];for(let i=0;i<35;i++)slots.push({x:750+(i%7)*30,y:190+Math.floor(i/7)*36});
  const count=txt(cx,cy+h/2-24,(n||0)+' LEADS','lbl count',g);
  return{g:g,r:r,slots:slots,count:count,cx:cx,cy:cy};
}
function drawLeads(list){return list.slots.map(s=>person(s.x,s.y,'var(--lead)',FRONT,1));}

async function scene2(){
  newScene(2);
  setTop('Scene 2 · Lead capture','100 VISITORS','Same traffic. Same 100 people. This time they land on a page offering something useful in exchange for an email.');
  const grid=gridPos(50,150,10,10,24,24);
  const vis=grid.map(g=>person(g.x,g.y,'var(--visitor)',FRONT,1,0));
  await moveAll(vis,grid.map(g=>({x:g.x,y:g.y,o:1})),400,3);
  arrowLine(285,258,383,258);
  const lp=box(470,260,160,150,'LANDING PAGE',{top:true});
  el('rect',{x:420,y:226,width:100,height:16,rx:4,fill:'#2b3470'},lp.g);

async function scene7(){

  const N=7,R0=140,L=2*Math.PI*R0;
  let phi=0,yTop=300;
  const geo=u=>{if(phi<1e-4)return{x:500+u,y:yTop,nx:0,ny:-1};const R=L/phi,a=u/R;return{x:500+R*Math.sin(a),y:yTop+R-R*Math.cos(a),nx:Math.sin(a),ny:-Math.cos(a)};};
  const path=el('path',{class:'wheelpath'},BACK);
  const nodes=labels.map((l,i)=>{const g=el('g',{},TOP);el('circle',{r:34,class:'node'},g);txt(0,1,icons[i],'ico',g);const lg=el('g',{},TOP);txt(0,0,l,'lbl',lg,15);g.style.opacity=0;lg.style.opacity=0;return{g:g,lg:lg};});
  const uOf=i=>-L/2+L*i/(N-1);
  function render(){
    let d='';for(let k=0;k<=140;k++){const p=geo(-L/2+L*k/140);d+=(k?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1);}
    path.setAttribute('d',d);
    nodes.forEach((n,i)=>{const p=geo(uOf(i));n.g.setAttribute('transform','translate('+p.x.toFixed(1)+','+p.y.toFixed(1)+')');n.lg.setAttribute('transform','translate('+(p.x+p.nx*62).toFixed(1)+','+(p.y+p.ny*62).toFixed(1)+')');});
  }
  render();
  path.style.strokeDasharray=L+' '+L;path.style.strokeDashoffset=L;
  await sleep(400);
  for(let i=0;i<N;i++){
    const from=parseFloat(path.style.strokeDashoffset),to=L-L*i/(N-1);
    await Promise.all([tween(350,t=>path.style.strokeDashoffset=lerp(from,to,t)),fade(nodes[i].g,1,350,0),fade(nodes[i].lg,1,350,0)]);
    await sleep(220);
  }
  path.style.strokeDasharray='none';
  await sleep(300);
  say('This is the journey you just played through.');
  await sleep(600);
  ask('Now… what if the end connects back to the beginning?',[{label:'Connect the end to the beginning',go:bend}]);

  async function bend(){
    clearBottom();
    setTop('Scene 7 · The reveal','WATCH THE LINE BEND','');
    await tween(3800,t=>{phi=2*Math.PI*t;yTop=lerp(300,150,t);render();const o=t>.82?Math.max(0,1-(t-.82)/.16):1;nodes[6].g.style.opacity=o;nodes[6].lg.style.opacity=o;},ease);
    nodes[6].g.remove();nodes[6].lg.remove();
    const ring=el('circle',{cx:500,cy:430,r:34,fill:'none',stroke:'var(--new)','stroke-width':3},TOP);
    tween(900,t=>{ring.setAttribute('r',34+40*t);ring.style.opacity=1-t;},easeOut).then(()=>ring.remove());
    const c=el('g',{transform:'translate(500,290) scale(0)'},TOP);
    txt(0,-15,'NOW YOU HAVE','bigt',c);const t2=txt(0,16,'A FLYWHEEL.','bigt',c);t2.style.fill='var(--cust)';
    await tween(700,t=>c.setAttribute('transform','translate(500,290) scale('+t+')'),easeOut);
    setTop('Scene 7 · The reveal','NOW YOU HAVE A FLYWHEEL.','');
    // visitors travelling the complete loop
    const cols=['var(--visitor)','var(--lead)','var(--lead)','var(--cust)','var(--cust)','var(--new)'];
    const ps=[];for(let i=0;i<10;i++)ps.push({f:i/10,p:person(500,430,'var(--visitor)',FRONT,1.1)});
    loop(dt=>{ps.forEach(o=>{o.f=(o.f+.075*dt)%1;const g=geo(-L/2+L*o.f);o.p.x=g.x;o.p.y=g.y;o.p.g.style.fill=cols[Math.min(5,Math.floor(o.f*6))];o.p.set();});});
    await sleep(600);
    say('The sale wasn\'t the end.','big');
    await sleep(1200);
    say('Part of the value created by one cycle can help power the next cycle.');
    await sleep(1200);
    ask('',[{label:'Continue',go:scene8}]);
  }
}

/* ====================================================
   helpers for wheels
==================================================== */
function wheel(cx,cy,r,labels,icons,nr,parent){
  const n=labels.length,out=[];
  labels.forEach((l,i)=>{const a=(-90+i*360/n)*Math.PI/180;const x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);
    const g=el('g',{transform:'translate('+x+','+y+')'},parent||TOP);const c=el('circle',{r:nr,class:'node'},g);
    if(icons)txt(0,1,icons[i],'ico',g);
    const lr=r+nr+(nr>25?26:22);const lt=txt(cx+lr*Math.cos(a),cy+lr*Math.sin(a),l,'lbl nodelbl',parent||TOP,15);
    out.push({g:g,c:c,lt:lt,x:x,y:y,a:a});});
  return out;
}
function orbit(cx,cy,r,n,speed,s){
  const cols=['var(--visitor)','var(--lead)','var(--lead)','var(--cust)','var(--cust)','var(--new)'];
  const ps=[];for(let i=0;i<n;i++)ps.push({f:i/n,p:person(cx,cy-r,'var(--visitor)',FRONT,s||.9)});
  loop(dt=>{ps.forEach(o=>{o.f=(o.f+speed*dt)%1;const a=-Math.PI/2+o.f*2*Math.PI;o.p.x=cx+r*Math.cos(a);o.p.y=cy+r*Math.sin(a);o.p.g.style.fill=cols[Math.floor(o.f*6)%6];o.p.set();});});
}

/* ====================================================
   SCENE 8 — SHOW THE DIFFERENCE
==================================================== */
async function scene8(){
  newScene(8);
  setTop('Scene 8 · The difference','FUNNEL vs FLYWHEEL','Same starting point. Different structure.');
  el('line',{x1:500,y1:30,x2:500,y2:530,stroke:'#2e3875','stroke-width':2,'stroke-dasharray':'4 8'},BACK);
  // left funnel
  txt(250,40,'FUNNEL','bigt',BACK);
  const ys=[115,200,285,370],ws=[240,200,160,130],nm=['Traffic','Lead','Customer','END'];
  ys.forEach((y,i)=>{box(250,y,ws[i],56,nm[i],i===3?{color:'var(--bad)',labelColor:'var(--bad)'}:{});if(i<3)txt(250,y+42,'↓','ledger arrow',BACK);});
  el('line',{x1:185,y1:410,x2:315,y2:410,stroke:'var(--bad)','stroke-width':5,'stroke-linecap':'round'},BACK);
  const fc=txt(250,470,'The journey stops at the sale.','small',BACK);
  const drop=person(250,80,'var(--visitor)',FRONT,1.2);let ft=0;
  loop(dt=>{ft=(ft+dt/2.2)%1;const k=Math.min(1,ft/.8);drop.y=lerp(80,370,ease(k));drop.o=ft>.85?Math.max(0,1-(ft-.85)/.15):1;drop.g.style.fill=k<.33?'var(--visitor)':(k<.95?'var(--lead)':'var(--cust)');drop.set();});
  // right flywheel
  txt(750,40,'FLYWHEEL','bigt',BACK);
  el('circle',{cx:750,cy:275,r:145,class:'wheelpath'},BACK);
  wheel(750,275,145,['Traffic','Lead','Follow-Up','Customer','Value','Reinvest'],null,20,BACK).forEach(n=>{n.lt.style.fontSize='13px';});
  txt(750,275,'↻','bigt',BACK).style.fontSize='44px';
  orbit(750,275,145,8,.09,.9);
  const cap=txt(750,490,'THE SYSTEM FEEDS THE NEXT CYCLE.','lbl',BACK);cap.style.fill='var(--cust)';
  await sleep(1400);
  say('A funnel ends at the sale. A flywheel feeds the next cycle.');
  say('This compares the structure of the two systems — it does not guarantee any particular result.','muted');
  await sleep(900);
  ask('',[{label:'Continue',go:finale}]);
}

/* ====================================================
   FINAL AHA SCREEN
==================================================== */
async function finale(){
  newScene(9);
  setTop('The big idea','Ahhh… THAT\'S why it\'s called a Flywheel.','');
  const cx=500,cy=285,r=205;
  el('circle',{cx:cx,cy:cy,r:r,class:'wheelpath'},BACK);
  const rd=el('circle',{cx:cx,cy:cy,r:r+14,class:'ringdash'},BACK);
  wheel(cx,cy,r,['ATTRACT','CAPTURE','FOLLOW UP','CONVERT','CREATE MORE\nVALUE','REINVEST'],['📣','🧲','✉️','🙂','💎','🔁'],28,TOP);
  const t=txt(cx,158,'THE FLYWHEEL SYSTEM','bigt',BACK);t.style.fontSize='20px';t.style.fill='var(--cust)';
  const items=['ATTRACT','CAPTURE','FOLLOW UP','CONVERT','CREATE MORE VALUE','REINVEST','ATTRACT AGAIN ↻'];
  let y=192;
  items.forEach((s,i)=>{const e=txt(cx,y,s,'lbl',BACK);e.style.fontSize='13px';if(i===6)e.style.fill='var(--new)';y+=17;if(i<6){txt(cx,y-2,'↓','ledger arrow',BACK).style.fontSize='11px';y+=12;}});

/* ====================================================
   EXPLORE THE FLYWHEEL — FINAL PAGE
==================================================== */
function explore(){
  newScene(10);
  setTop('Final step','EXPLORE THE FLYWHEEL','Switch parts of the system on and off and watch how the loop behaves.');
  badge(true);
  const C={x:370,y:285},R=185;
  const S={capture:true,follow:true,recurring:true,reinvest:true};
  const nodeOf={capture:1,follow:2,recurring:4,reinvest:5};
  const ang=i=>(-90+i*60)*Math.PI/180;
  const segs=[];
  for(let i=0;i<6;i++){const a1=ang(i)+.19,a2=ang(i+1)-.19;segs.push(el('path',{class:'seg',d:'M'+(C.x+R*Math.cos(a1))+' '+(C.y+R*Math.sin(a1))+' A'+R+' '+R+' 0 0 1 '+(C.x+R*Math.cos(a2))+' '+(C.y+R*Math.sin(a2))},BACK));}
  const rd=el('circle',{cx:C.x,cy:C.y,r:R-26,class:'ringdash'},BACK);
  const nodes=wheel(C.x,C.y,R,['TRAFFIC','LEAD\nCAPTURE','FOLLOW-UP','CUSTOMER','RECURRING\nVALUE','REINVESTMENT'],['📣','🧲','✉️','🙂','💎','🔁'],30,TOP);
  txt(C.x,C.y-10,'↻','bigt',BACK).style.fontSize='40px';
  const mt=txt(C.x,C.y+30,'MOMENTUM','small',BACK);
  // readout
  el('rect',{x:690,y:80,width:280,height:400,rx:18,class:'panelcard'},BACK);
  txt(830,110,'Readout','lbl',BACK);
  const rows=[['Visitors','vis'],['Leads captured','leads'],['Customers','cust'],['Customer Value Delivered','value'],['Reinvestment','reinv']];
  const st={vis:0,leads:0,cust:0,value:0,reinv:0};const vt={};
  rows.forEach((r,i)=>{txt(712,160+i*42,r[0],'small',BACK,16,'start');vt[r[1]]=txt(948,160+i*42,'0','lbl',BACK,16,'end');});
  txt(712,380,'Momentum','small',BACK,16,'start');
  el('rect',{x:712,y:396,width:236,height:14,rx:7,class:'meterbg'},BACK);
  const meter=el('rect',{x:712,y:396,width:0,height:14,rx:7,class:'meter'},BACK);
  txt(830,450,'Illustrative scores, not money or predicted results.','small',BACK).style.fontSize='10.5px';

  function applyStyles(){Object.keys(nodeOf).forEach(k=>{const i=nodeOf[k];nodes[i].c.classList.toggle('off',!S[k]);nodes[i].g.style.opacity=S[k]?1:.45;nodes[i].lt.classList.toggle('off',!S[k]);segs[i].classList.toggle('off',!S[k]);});}
  // controls
  const a=$('actions');a.innerHTML='';
  const tg=document.createElement('div');tg.className='toggles';
  [['capture','Lead Capture'],['follow','Follow-Up'],['recurring','Recurring Value'],['reinvest','Reinvestment']].forEach(([k,l])=>{
    const b=document.createElement('button');b.className='tog on';b.setAttribute('aria-pressed','true');b.innerHTML='<span class="sw"></span>'+l+' <b>ON</b>';
    b.onclick=()=>{S[k]=!S[k];b.classList.toggle('on',S[k]);b.setAttribute('aria-pressed',S[k]);b.querySelector('b').textContent=S[k]?'ON':'OFF';applyStyles();};
    tg.appendChild(b);});
  $('msgs').appendChild(tg);
  const b1=document.createElement('button');b1.className='btn';b1.textContent='Run it again';b1.onclick=scene1;
  const b2=document.createElement('button');b2.className='btn alt';b2.textContent='Take the next step';b2.onclick=takeNextStep;
  a.appendChild(b1);a.appendChild(b2);
  applyStyles();

  const SPEED=.11,BASE=.9;let parts=[],acc=0,qacc=0,queue=0,rot=0;const spawns=[];
  function posOf(pt){const an=-Math.PI/2+pt.f*2*Math.PI;return{x:C.x+(R+pt.j)*Math.cos(an),y:C.y+(R+pt.j)*Math.sin(an),a:an};}
  function spawn(isNew,now){if(parts.length>=90)return;const pt={f:0,next:1,j:rand(-7,7),kind:'visitor',nurtured:false,tokens:0,leaving:false,dead:false,p:person(C.x,C.y-R,isNew?'var(--new)':'var(--visitor)',FRONT,.9)};parts.push(pt);st.vis++;spawns.push(now);}
  function leave(pt){pt.leaving=true;const an=-Math.PI/2+pt.f*2*Math.PI;pt.vx=Math.cos(an)*60;pt.vy=Math.sin(an)*60;}
  function handle(pt,k,now){
    const n=nodes[k%6];
    if(k===1){if(S.capture){if(Math.random()<.35){pt.kind='lead';pt.p.g.style.fill='var(--lead)';st.leads++;}else leave(pt);}}
    else if(k===2){if(pt.kind==='lead'&&S.follow){pt.nurtured=true;pt.p.s=1.1;}}
    else if(k===3){const pr=pt.kind==='visitor'?.03:(pt.nurtured?.35:.10);if(Math.random()<pr){pt.kind='cust';pt.p.g.style.fill='var(--cust)';pt.p.s=1.2;st.cust++;}else leave(pt);}
    else if(k===4){pt.tokens=S.recurring?4:1;st.value+=pt.tokens;floatText(n.x,n.y-40,'+'+pt.tokens+' value');}
    else if(k===5){if(!S.reinvest){leave(pt);floatText(n.x,n.y-40,'taken out','var(--bad)');}else st.reinv+=pt.tokens;}
    else if(k===6){queue+=pt.tokens;pt.dead=true;pt.p.g.remove();floatText(nodes[0].x,nodes[0].y-44,'+'+pt.tokens+' new','var(--new)');}
  }
  loop((dt,now)=>{
    acc+=dt*BASE;while(acc>=1){acc--;spawn(false,now);}
    if(queue>0){qacc+=dt*3;while(qacc>=1&&queue>0){qacc--;queue--;spawn(true,now);}}else qacc=0;
    parts.forEach(pt=>{
      if(pt.dead)return;
      if(pt.leaving){pt.p.x+=pt.vx*dt;pt.p.y+=pt.vy*dt;pt.p.o-=dt*1.1;pt.p.set();if(pt.p.o<=0){pt.dead=true;pt.p.g.remove();}return;}
      pt.f+=SPEED*dt;
      while(!pt.leaving&&!pt.dead&&pt.f>=pt.next/6){handle(pt,pt.next,now);pt.next++;}
      if(!pt.leaving&&!pt.dead){const p=posOf(pt);pt.p.x=p.x;pt.p.y=p.y;pt.p.set();}
    });
    parts=parts.filter(p=>!p.dead);
    while(spawns.length&&now-spawns[0]>8000)spawns.shift();
    const rate=spawns.length/8;
    meter.setAttribute('width',Math.min(1,rate/2.4)*236);
    rot=(rot+dt*(8+rate*45))%360;rd.setAttribute('transform','rotate('+rot+' '+C.x+' '+C.y+')');
    mt.textContent='MOMENTUM '+(rate<1?'LOW':rate<1.5?'BUILDING':'STRONG');
    for(const k in vt)vt[k].textContent=st[k];
  });
}

scene1();
})();
